name: Reference Data Fetch (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      JOLPICA_BASE_URL: ${{ secrets.JOLPICA_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install data dependencies
        run: python -m pip install -c data/constraints.txt -r data/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off

      - name: Fetch reference data
        run: python data/fetch_reference_data.py --start-season 2024

      - name: Normalize curated outputs
        run: python data/normalize_results.py

      - name: Validate fetched reference coverage
        run: python -c "import csv; from pathlib import Path; p=Path('data/curated/races.csv'); rows=list(csv.DictReader(p.open())); assert rows, 'No races fetched'"
